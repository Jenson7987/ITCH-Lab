name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hardening:
    name: Sanitizers, fuzzing and scans
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"

      - name: Install pinned development dependencies
        run: |
          python -m pip install --require-hashes -r python/requirements-dev.lock
          python -m pip install --no-deps -e ./python

      - name: Require the real libFuzzer runtime
        run: cmake --preset fuzz -DITCHLAB_FUZZ_ENGINE=libfuzzer

      - name: Run the TASK-028 security suite
        env:
          ITCHLAB_SECURITY_PYTHON: python
        run: ./scripts/security/task028-security.sh
