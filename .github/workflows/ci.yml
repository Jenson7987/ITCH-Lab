name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "43 3 * * 4"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  documentation:
    name: Documentation contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"

      - name: Check Markdown links and diagrams
        run: |
          python scripts/ci/check_docs.py
          python scripts/ci/check_traceability.py

  quality:
    name: Static checks, tests and coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"

      - name: Install system build tools
        run: sudo apt-get update && sudo apt-get install --yes clang-format ninja-build zlib1g-dev

      - name: Install pinned development dependencies
        run: |
          python -m pip install --require-hashes -r python/requirements-dev.lock
          python -m pip install --no-deps -e ./python

      - name: Check C++ formatting
        run: |
          find cpp benchmarks -type f \( -name '*.cpp' -o -name '*.hpp' \) -print0 |
            xargs -0 clang-format --dry-run --Werror

      - name: Check Python formatting, lint and types
        run: |
          python -m ruff format --check python scripts
          python -m ruff check python scripts
          python -m mypy python/src

      - name: Run Python tests with tiered branch coverage
        run: |
          python -m coverage erase
          python -m coverage run --branch --source=itchlab_research -m pytest python/tests
          python -m coverage json -o build/python-coverage.json
          python scripts/ci/check_coverage.py build/python-coverage.json

      - name: Run C++ tests with compiler coverage regression floor
        env:
          ITCHLAB_COVERAGE_PYTHON: python
        run: ./scripts/ci/cpp-coverage.sh

  native:
    name: Native ${{ matrix.platform }} build and test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x86_64
            expected_kernel: Linux
            expected_architecture: x86_64
          - os: macos-15
            platform: macos-arm64
            expected_kernel: Darwin
            expected_architecture: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Assert the supported native platform
        env:
          EXPECTED_ARCHITECTURE: ${{ matrix.expected_architecture }}
          EXPECTED_KERNEL: ${{ matrix.expected_kernel }}
        run: |
          test "$(uname -s)" = "$EXPECTED_KERNEL"
          test "$(uname -m)" = "$EXPECTED_ARCHITECTURE"

      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes ninja-build zlib1g-dev

      - name: Configure, build and test
        run: |
          cmake --preset dev
          cmake --build --preset dev
          ctest --preset dev --output-on-failure

  release-install:
    name: Offline installed E2E on ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x86_64
          - os: macos-15
            platform: macos-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"

      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes ninja-build zlib1g-dev

      - name: Install pinned release-build tools
        run: python -m pip install --require-hashes -r python/requirements-dev.lock

      - name: Build, install and test release artefacts without network access
        env:
          ITCHLAB_RELEASE_PYTHON: python
        run: ./scripts/release/task030-release-smoke.sh

  performance-smoke:
    name: Release performance smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"

      - name: Install system build tools
        run: sudo apt-get update && sudo apt-get install --yes ninja-build zlib1g-dev

      - name: Build the release performance target
        run: |
          python -m tests.fixtures.generate_performance
          cmake --preset release
          cmake --build --preset release

      - name: Enforce the catastrophic parser-and-book threshold
        run: |
          evidence_root=$(mktemp -d)
          ./build/release/itchlab benchmark \
            --fixture data/fixtures/performance.itch \
            --stage book \
            --repetitions 3 \
            --output "$evidence_root/performance.json" \
            --format json \
            > "$evidence_root/envelope.json"
          python - "$evidence_root/envelope.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          envelope = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          measurement = envelope["summary"]["measurements"][0]
          rate = measurement["median_messages_per_second"]
          if measurement["id"] != "PERF-004" or rate < 1_000_000:
              raise SystemExit(f"PERF-004 catastrophic regression: {rate:.0f} messages/s")
          print(f"PERF-004 smoke passed at {rate:.0f} messages/s.")
          PY
